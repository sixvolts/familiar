# E2E + integration CI (TESTING-PLAN.md §"CI integration").
#
# Two jobs, each with its own pgvector-enabled Postgres service:
#
#   go-test — the gateway's full `go test ./...` with FAMILIAR_TEST_DSN
#             set, so the DB-backed integration tests (migrations,
#             memory store, shards, wiki) actually run instead of
#             skipping.
#   e2e     — the Playwright suite. The gateway fixture builds both
#             binaries, boots them against the service DB, and runs
#             all flows. Traces/report upload on failure.
#
# Advisory-only on first land per the plan: don't mark these as
# required checks until the suite has proven it isn't flaky.
#
# The Postgres image is pgvector/pgvector (NOT plain postgres) —
# the gateway's memories_base migration runs CREATE EXTENSION vector,
# which needs the extension .so present in the image.

name: e2e

# BRING-UP STATE (2026-08-12): main and pull_request are deliberately NOT
# triggers. zuul deploy gate reads run conclusions for the SHA it just pulled
# and HARD-ABORTS on a failure, so a red run against a main SHA would block
# every deploy. Until the icecube runner is green, only an explicit dispatch or
# a push to a ci/** branch runs this.
#
# Restore `push: branches: [main]` and `pull_request:` once icecube is green
# (ci-rollout-plan.md step 5).
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # icecube owns this value: the runner uses a persistent local Postgres, not a
  # service container (unavailable on a self-hosted macOS runner). Set the repo
  # variable FAMILIAR_TEST_DSN to match that instance; the literal below is only
  # a fallback so the workflow stays runnable without it.
  FAMILIAR_TEST_DSN: ${{ vars.FAMILIAR_TEST_DSN || 'postgres://postgres:test@localhost:5432/postgres?sslmode=disable' }}

jobs:
  go-test:
    runs-on: [self-hosted, macos, arm64, icecube, mlx]
    timeout-minutes: 15
    # No `services:` block: service containers are Linux-runner only and do
    # not work on a self-hosted macOS runner. Postgres is a persistent
    # launchd-managed instance on the box; FAMILIAR_TEST_DSN points at it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: familiar-gateway/go.sum
      # Formatting + vet are free (both modules are clean today) and stop
      # style/correctness drift from reaching main, where deploys pull from.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l familiar-gateway familiar-workspace)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: |
          (cd familiar-gateway && go vet ./...)
          (cd familiar-workspace && go vet ./...)

      # Route through the Makefile so CI and local runs share ONE definition
      # of "the Go suite". That buys two things a bare `go test ./...` misses:
      #   -count=1 — some tests read files OUTSIDE their module (the shipped
      #     prompts/ guards); Go's test cache does not key on those, and
      #     setup-go restores GOCACHE, so a prompt-only change could replay a
      #     stale PASS.
      #   guard-dsn — refuses to run without FAMILIAR_TEST_DSN instead of
      #     letting ~161 DB-backed tests skip themselves into a green run.
      - name: gateway + workspace tests (via make, -count=1 + guard-dsn)
        run: make test-integration

      # guard-dsn proves the DSN is SET; this proves the DB-backed tests
      # actually RAN. A canary that cannot pass by skipping: if the DB were
      # unreachable this test would skip, and `--- PASS` would be absent.
      - name: verify DB-backed tests actually ran
        working-directory: familiar-gateway
        run: |
          go test -count=1 -run TestMigrateFreshDatabase -v ./internal/db/ \
            | tee /dev/stderr | grep -q '^--- PASS: TestMigrateFreshDatabase' \
            || { echo "DB-backed canary did not run — integration coverage is not being exercised"; exit 1; }

  e2e:
    runs-on: [self-hosted, macos, arm64, icecube, mlx]
    timeout-minutes: 20
    # No `services:` block: service containers are Linux-runner only and do
    # not work on a self-hosted macOS runner. Postgres is a persistent
    # launchd-managed instance on the box; FAMILIAR_TEST_DSN points at it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            familiar-gateway/go.sum
            familiar-workspace/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: npm ci
        working-directory: tests/e2e
        run: npm ci

      # Cache the Playwright browser download keyed on the lockfile's
      # Playwright version. --with-deps is dropped: it only installs OS
      # packages on Ubuntu. On a persistent box the browser usually survives
      # between jobs anyway, so this cache is belt-and-braces.
      - name: resolve playwright version
        id: pw
        working-directory: tests/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: install chromium
        working-directory: tests/e2e
        run: npx playwright install chromium

      # Fail fast with a readable compile error; the fixture would
      # otherwise surface it wrapped in a boot-timeout message.
      - name: build gateway + workspace
        run: |
          (cd familiar-gateway && go build ./...)
          (cd familiar-workspace && go build ./...)

      - name: playwright test
        working-directory: tests/e2e
        run: npm test

      # always(), not failure(): CI retries each test twice, so a test that
      # failed once and passed on retry leaves the job green — and that is
      # exactly the run whose trace you want. `trace: on-first-retry` captured
      # it; failure() was throwing it away.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
