# Familiar — persistent tier services
# Usage: docker compose up -d
#
# Postgres with pgvector for semantic memory, fact store, and conversation history.
# Data is persisted in a named volume so it survives container restarts.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: familiar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: familiar
      # Required, from a git-ignored .env next to this file:
      #   POSTGRES_PASSWORD=<openssl rand -hex 24>
      # setup.sh generates one. The old literal was a password published
      # in this repo, on a port reachable from the network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to docker-compose.yml (see DEPLOYMENT.md)}
      POSTGRES_DB: familiar
    ports:
      # Loopback only. A bare "5432:5432" listens on every interface,
      # and Docker's published ports bypass ufw/INPUT firewall rules, so
      # "firewall everything but 443" left the database open.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familiar"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
