# E2E + integration CI (TESTING-PLAN.md §"CI integration").
#
# ONE job, all tiers, sequential, on the icecube self-hosted runner.
#
# It was two jobs (go-test, e2e) when both ran on GitHub-hosted Linux with
# their own pgvector service container. Neither of those holds now:
#
#   - Service containers are Linux-runner only. On a self-hosted macOS
#     runner `services:` does not warn, it fails confusingly. Postgres is a
#     persistent launchd-managed instance on the box instead, which means
#     each run inherits whatever the last one left behind — survivable only
#     because 32346f9 and b88a77d make the shared schemas truncate.
#
#   - The runner is registered --ephemeral, so it de-registers after ONE
#     job. A second job in the same workflow has no runner left to pick it
#     up. Splitting the work across jobs would strand everything after the
#     first, and with one runner and one MLX server parallel jobs would
#     serialise anyway.
#
# Tiers, in order:
#   1  go test hermetic (no DSN)      — proves the suite stands alone
#   2  go test with FAMILIAR_TEST_DSN — the ~161 DB-backed tests
#   3  Playwright, modelless          — incl. pixel baselines
#   4  Playwright against MLX         — the real inference path
#   5  Adjudication                   — reads the artifacts, judges the pass
#
# Tiers 1-4 are run by ci/icecube/run-tiers.sh, which is deterministic and
# never consults a model. Tier 5 is a separate invocation with read-only
# tools. Keep them apart: a run must stay reproducible without the agent.

name: e2e

# Bring-up complete (2026-08-15). main and pull_request were held back while
# the icecube runner was being stood up, because zuul's deploy gate reads run
# conclusions for the SHA it just pulled and hard-aborts on a failure, so a red
# run against a main SHA would have blocked every deploy with no way out. Both
# preconditions are now met: the suite has gone green repeatedly on icecube,
# and FAMILIAR_DEPLOY_ALLOW_FAILED_CI exists as a break-glass.
#
# pull_request runs against the MERGE RESULT, not the branch tip, so it catches
# the case a push-triggered branch run structurally cannot: a branch that is
# green alone but breaks once combined with main.
# Deliberately NO `pull_request:` trigger. Three runs per change is one too
# many, and this is the one to cut.
#
# The floor is two: one pre-merge to gate the merge, one post-merge to gate the
# deploy. The post-merge run is unavoidable — familiar-deploy.sh keys the gate
# on a SHA, and GitHub's merge/squash/rebase buttons all mint a new commit, so
# the merge commit is a SHA nothing has tested.
#
# That leaves a choice of pre-merge trigger, and push wins on ergonomics: the
# check attaches to the branch head, so by the time a PR is opened it is
# ALREADY green and the merge button is live. With pull_request instead,
# opening the PR starts a fresh ~8min run while the button sits greyed out.
#
# What this gives up: pull_request tests the branch MERGED WITH main, catching
# a branch that is green alone and breaks once combined. On a solo repo where
# main only advances through these same PRs, a branch is nearly always already
# current, and the post-merge run still catches it — just after the merge
# rather than before. If main ever gets busier, put pull_request back and drop
# the push trigger instead.
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # icecube owns this value: the runner uses a persistent local Postgres, not a
  # service container (unavailable on a self-hosted macOS runner). Set the repo
  # variable FAMILIAR_TEST_DSN to match that instance; the literal below is only
  # a fallback so the workflow stays runnable without it.
  # Model-backed specs (tier 4) run against icecube's local MLX model, which is
  # much slower than production furnace. A run measured ~230s there against the
  # spec default of 120s. See tests/e2e/flows/scheduled*.spec.ts.
  FAMILIAR_E2E_RUN_TIMEOUT: '360000'
  FAMILIAR_TEST_DSN: ${{ vars.FAMILIAR_TEST_DSN || 'postgres://postgres:test@localhost:5432/postgres?sslmode=disable' }}
  # The MLX server, loopback-only on the box. Tier 4 points the E2E specs at
  # it; tier 3 overrides this with a closed port so the model-backed specs
  # skip by their own /health gate.
  FAMILIAR_TEST_CHAT_MODEL_URL: ${{ vars.FAMILIAR_TEST_CHAT_MODEL_URL || 'http://127.0.0.1:8081' }}
  ARTIFACTS: ${{ github.workspace }}/artifacts

jobs:
  tiers:
    runs-on: [self-hosted, macos, arm64, icecube, mlx]
    # Scoped explicitly. Declaring `permissions` REPLACES the defaults, so
    # contents: read has to be listed or actions/checkout breaks.
    # pull-requests: write is for the auto-PR step at the end — it uses the
    # per-run GITHUB_TOKEN, which expires with the job, rather than a
    # long-lived PAT carrying a standing permission.
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    # No `services:` block: service containers are Linux-runner only and do
    # not work on a self-hosted macOS runner. Postgres is a persistent
    # launchd-managed instance on the box; FAMILIAR_TEST_DSN points at it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # setup-go and setup-node stay, and are NOT redundant on a self-hosted
      # box. They pin the toolchain rather than inheriting whatever Homebrew
      # last upgraded to: icecube currently has node v26.7.0 system-wide while
      # this suite is validated on 22, so dropping setup-node would silently
      # move Playwright a major version. They also make the toolchain
      # independent of the runner's non-login PATH.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            familiar-gateway/go.sum
            familiar-workspace/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # Formatting + vet are free (both modules are clean today) and stop
      # style/correctness drift from reaching main, where deploys pull from.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l familiar-gateway familiar-workspace)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: |
          (cd familiar-gateway && go vet ./...)
          (cd familiar-workspace && go vet ./...)

      # Route through the Makefile so CI and local runs share ONE definition
      # of "the Go suite". guard-dsn refuses to run without FAMILIAR_TEST_DSN
      # instead of letting ~161 DB-backed tests skip themselves into a green
      # run, and -count=1 stops a stale PASS replaying when only the
      # out-of-module prompts/ guards changed.
      - name: gateway + workspace tests (via make, -count=1 + guard-dsn)
        run: make test-integration

      # guard-dsn proves the DSN is SET; this proves the DB-backed tests
      # actually RAN. A canary that cannot pass by skipping, and the only
      # check that catches DSN-set-but-database-unreachable, where the tests
      # skip and `go test` still exits 0.
      #
      # This stays a HARD gate even though run-tiers.sh records the same fact
      # in the manifest as derived.db_canary_ran. Dropping it would relocate
      # the gate onto tier 5, which is advisory. Revisit once tier 5 is a
      # required check.
      - name: verify DB-backed tests actually ran
        working-directory: familiar-gateway
        run: |
          go test -count=1 -run TestMigrateFreshDatabase -v ./internal/db/ \
            | tee /dev/stderr | grep -q '^--- PASS: TestMigrateFreshDatabase' \
            || { echo "DB-backed canary did not run — integration coverage is not being exercised"; exit 1; }

      - name: npm ci
        working-directory: tests/e2e
        run: npm ci

      # No browser cache action. On a GitHub-hosted runner the machine is new
      # every time, so caching ~150MB of chromium is a real saving. This runner
      # is a persistent Mac: ~/Library/Caches/ms-playwright survives between
      # jobs on its own (the --ephemeral flag re-registers the runner, it does
      # not wipe the user's home), so the cache action bought nothing and cost
      # an action to allowlist, pin and maintain. `playwright install` is a
      # no-op when the browser is already present.
      #
      # --with-deps is also omitted deliberately: it only installs OS packages
      # on Ubuntu.
      - name: install chromium
        working-directory: tests/e2e
        run: npx playwright install chromium

      # Fail fast with a readable compile error; the fixture would otherwise
      # surface it wrapped in a boot-timeout message.
      - name: build gateway + workspace
        run: |
          (cd familiar-gateway && go build ./...)
          (cd familiar-workspace && go build ./...)

      # Tiers 1-4. Deterministic, never consults a model. Writes the artifacts
      # and manifest that tier 5 reads.
      #
      # This re-runs the Go suite the `make` step above already ran, and that
      # is deliberate. The steps above are the GATE; this produces the
      # EVIDENCE. The hollow-skip check needs `go test -json` from a run WITH
      # the DSN and one WITHOUT it — the delta between the two skip counts is
      # the proof — and `make` emits no -json.
      - name: run tiers 1-4
        run: ci/icecube/run-tiers.sh --artifacts "$ARTIFACTS"

      # Tier 5. Advisory: it records an objection but does not fail the gate.
      # Flip to --enforce once its verdicts have a track record.
      - name: tier 5 — adjudicate
        if: always()
        env:
          # The native installer puts the launcher at ~/.local/bin/claude,
          # which is NOT on a non-login shell PATH — and adjudicate.sh gates
          # on `command -v claude`, so without this it reports
          # adjudicator-unavailable however well the install went. Note the
          # runner user needs its OWN install and its OWN credentials: a
          # binary in another user's home is unreadable (mode 700), and
          # Claude Code credentials are per-user.
          PATH: /Users/familiar-runner/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: ci/icecube/adjudicate.sh --artifacts "$ARTIFACTS" --timeout 600

      # always(), not failure(): retries can leave a job green while hiding
      # the run whose trace you actually want.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: icecube-tier-artifacts
          path: |
            artifacts/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      # Open the PR automatically once the branch is green.
      #
      # The operator's job should be one click (Merge), not "open a PR, then
      # wait". Because `pull_request` is no longer a trigger, the check is
      # already attached to this branch head by the time the PR appears, so the
      # merge button is live the moment it shows up.
      #
      # Uses the per-run GITHUB_TOKEN rather than a PAT: it is minted for this
      # job and dies with it, so no long-lived credential gains a standing
      # pull-requests permission. Note GitHub deliberately does not let a
      # GITHUB_TOKEN-created PR trigger further workflow runs (loop
      # prevention), which is exactly right here — the branch run IS the check.
      #
      # Requires Settings -> Actions -> General -> "Allow GitHub Actions to
      # create and approve pull requests". Without it this step 403s; it is
      # non-fatal by design (continue-on-error) so a missing setting never
      # fails an otherwise green run.
      - name: open PR if green
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error

          repo   = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF"].removeprefix("refs/heads/")
          owner  = repo.split("/")[0]
          token  = os.environ["GH_TOKEN"]

          def api(path, data=None):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=json.dumps(data).encode() if data else None,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json"},
                  method="POST" if data else "GET")
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          existing = api(f"/repos/{repo}/pulls?head={owner}:{branch}&state=open")
          if existing:
              print("PR already open:", existing[0]["html_url"])
              raise SystemExit(0)

          title = subprocess.run(["git", "log", "-1", "--format=%s"],
                                 capture_output=True, text=True).stdout.strip()
          body  = subprocess.run(["git", "log", "-1", "--format=%b"],
                                 capture_output=True, text=True).stdout.strip()
          sha   = os.environ.get("GITHUB_SHA", "")[:8]
          note  = (f"Opened automatically after the `tiers` check passed on `{sha}`.\n\n"
                   "The check is attached to this branch head, so this is mergeable now.")
          try:
              pr = api(f"/repos/{repo}/pulls",
                       {"title": title or branch,
                        "head": branch, "base": "main",
                        "body": (body + "\n\n---\n" + note) if body else note})
              print("opened", pr["html_url"])
          except urllib.error.HTTPError as e:
              detail = e.read().decode()[:300]
              print(f"could not open PR (HTTP {e.code}): {detail}")
              if e.code == 403:
                  print("Likely: Settings -> Actions -> General -> "
                        "'Allow GitHub Actions to create and approve pull requests' is off.")
              raise SystemExit(0)
          PY
